name: Pipeline Shopee Grupos

on:
  schedule:
    # Até 8 execuções por dia (UTC). Ajuste conforme fuso desejado.
    # Exemplos aproximados em BRT (UTC-3):
    # 08:00, 10:00, 12:00, 14:00, 16:00, 18:00, 20:00, 22:00 BRT
    - cron: "0 11,13,15,17,19,21,23,1 * * *"
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar de verdade nos grupos que aceitam Página (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax check
        run: npm test

      - name: Diagnóstico Chromium Shopee
        env:
          BROWSER_STORAGE_STATE_B64: ${{ secrets.BROWSER_STORAGE_STATE_B64 }}
        run: |
          echo "=== AMBIENTE ==="
          uname -a
          node --version
          npm --version

          echo
          echo "=== CHROMIUM ==="
          which chromium || true
          chromium --version || true
          which google-chrome || true
          google-chrome --version || true

          echo
          echo "=== PLAYWRIGHT ==="
          node -e "console.log('playwright:', require('playwright/package.json').version)"

          echo
          echo "=== CONFIG BROWSER ==="
          echo "BROWSER_HEADLESS=true"
          echo "BROWSER_NO_SANDBOX=true"

          echo
          echo "=== STORAGE STATE ==="
          if [ -n "$BROWSER_STORAGE_STATE_B64" ]; then
            python -c 'import base64,json,os; d=json.loads(base64.b64decode(os.environ["BROWSER_STORAGE_STATE_B64"])); print("storageState bytes:", len(base64.b64decode(os.environ["BROWSER_STORAGE_STATE_B64"]))); print("cookies:", len(d.get("cookies", []))); print("origins:", len(d.get("origins", []))); print("localStorage:", sum(len(o.get("localStorage", [])) for o in d.get("origins", [])))'
          else
            echo "storageState ausente"
          fi

          echo
          echo "=== FIM DIAGNOSTICO ==="

      - name: Run pipeline (coleta + classificação + seleção + conversão dry-run + publicador)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          COLETOR_LIMIT: "100"
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          PUBLICAR: ${{ github.event.inputs.publicar || 'false' }}
          # Conversão afiliados (navegador) — dry-run seguro nesta etapa
          AFILIADOS_CONVERTER: "true"
          AFILIADOS_INCLUIR_CLASSIFICADAS: "false"
          SHOPEE_CONVERSAO_URL: ${{ secrets.SHOPEE_CONVERSAO_URL }}
          SHOPEE_CONVERSAO_DRY_RUN: "true"
          BROWSER_STORAGE_STATE_B64: ${{ secrets.BROWSER_STORAGE_STATE_B64 }}
          BROWSER_HEADLESS: "true"
          BROWSER_NO_SANDBOX: "true"
          # Publicação browser em modo preparar (não publica)
          PUBLICADOR: "navegador"
          MODO_PUBLICACAO_BROWSER: "preparar"
          EXIGIR_LINK_AFILIADO: "true"
        run: npm run pipeline

      - name: Commit data artifacts (se houver mudanças)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            data/ofertas-brutas.json \
            data/ofertas-classificadas.json \
            data/selecao-atual.json \
            data/historico-publicacoes.json \
            data/resultado-publicacao.json \
            data/fila-links-afiliados.json \
            data/links-afiliados.json \
            || true
          if git diff --staged --quiet; then
            echo "Nenhuma alteração em data/ para commit."
          else
            git commit -m "chore(data): atualiza artefatos do pipeline $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
