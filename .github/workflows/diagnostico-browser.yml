name: Diagnóstico Browser Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Testar Playwright
        run: node -e "const { chromium } = require('playwright'); (async()=>{ const browser=await chromium.launch({headless:true}); const page=await browser.newPage(); await page.goto('https://example.com',{waitUntil:'domcontentloaded',timeout:30000}); console.log('Titulo:',await page.title()); console.log('URL:',page.url()); await page.screenshot({path:'browser-test.png',fullPage:true}); await browser.close(); console.log('PLAYWRIGHT_OK'); })().catch(e=>{console.error(e);process.exit(1)})"

      - name: Salvar screenshot
        uses: actions/upload-artifact@v4
        with:
          name: browser-test
          path: browser-test.png
