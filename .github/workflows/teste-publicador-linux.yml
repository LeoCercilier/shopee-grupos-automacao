name: Teste Publicador Linux

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicador:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificar sintaxe
        run: npm test

      - name: Instalar Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Testar publicador de cursos em dry-run
        run: xvfb-run --auto-servernum npm run curso:teste

      - name: Testar publicador Shopee em dry-run
        run: xvfb-run --auto-servernum npm run browser:teste
